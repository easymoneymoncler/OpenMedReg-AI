  status: done
  outcome: MDR consolidé du 2026-11-09 (FR, EN) ajouté au corpus public avec provenance
    ; découpage en 2 445 unités aux identifiants identiques dans les deux langues
    ; 43 tests passent.
  next_action: Dossier technique fictif annoté face à l'Annexe II, puis banc d'évaluation
    ; faire valider SOURCE.yaml par l'utilisateur.
- id: 20261110T231525Z-CLAUDE-03767701
